MEMORY {
    APP: start = $6000, size = $6000, file = %O, fill = no;
    LOW: start = $13C0, size = $0A40, file = "";
    EXTRA: start = $0E30, size = $00D0, file = "";
    AUXWORK: start = $0040, size = $0040, file = "";
    AUXASSET: start = $6000, size = $4000, file = "build/game/aux-assets.bin", fill = no;
    AUXTEXT: start = $1400, size = $0C00, file = "build/game/text-assets.bin", fill = no;
    AUXEXTRA: start = $0C00, size = $0800, file = "build/game/extra-assets.bin", fill = no;
}
SEGMENTS {
    CODE: load = APP, type = ro;
    RODATA: load = APP, type = ro, align = $100;
    ENDCODE: load = APP, type = ro, define = yes;
    AUXREAD: load = APP, run = AUXWORK, type = ro, define = yes;
    LOWCODE: load = APP, run = LOW, type = ro, define = yes;
    EXTRACODE: load = APP, run = EXTRA, type = ro, define = yes;
    ASSETS: load = AUXASSET, type = ro, define = yes;
    TEXTASSETS: load = AUXTEXT, type = ro, define = yes;
    ASSETEXTRA: load = AUXEXTRA, type = ro, define = yes, optional = yes;
}
