MEMORY {
    APP: start = $6000, size = $6000, file = %O, fill = no;
    LOW: start = $1400, size = $0900, file = "";
    AUXWORK: start = $0040, size = $0020, file = "";
    AUXASSET: start = $6000, size = $4000, file = "build/game/aux-assets.bin", fill = no;
}
SEGMENTS {
    CODE: load = APP, type = ro;
    RODATA: load = APP, type = ro, align = $100;
    AUXREAD: load = APP, run = AUXWORK, type = ro, define = yes;
    LOWCODE: load = APP, run = LOW, type = ro, define = yes;
    ASSETS: load = AUXASSET, type = ro, define = yes;
}
