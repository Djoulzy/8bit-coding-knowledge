MEMORY {
    APP: start = $6000, size = $6000, file = %O, fill = no;
    LOW: start = $13C0, size = $0A40, file = "";
    EXTRA: start = $0E30, size = $00D0, file = "";
    PASS: start = $0C30, size = $00D0, file = "";
    PASSUI: start = $1F10, size = $00F0, file = "";
    PASSTAIL: start = $0F80, size = $0080, file = "";
    AUXWORK: start = $0040, size = $0040, file = "";
    AUXASSET: start = $6000, size = $6000, file = "build/game-mono/aux-assets.bin", fill = no;
    AUXTEXT: start = $1400, size = $0C00, file = "build/game-mono/text-assets.bin", fill = no;
    AUXEXTRA: start = $0C00, size = $0800, file = "build/game-mono/extra-assets.bin", fill = no;
}
SEGMENTS {
    CODE: load = APP, type = ro;
    RODATA: load = APP, type = ro, align = $100;
    AUXREAD: load = APP, run = AUXWORK, type = ro, define = yes;
    LOWCODE: load = APP, run = LOW, type = ro, define = yes;
    EXTRACODE: load = APP, run = EXTRA, type = ro, define = yes;
    PASSCODE: load = APP, run = PASS, type = ro, define = yes;
    PASSUI: load = APP, run = PASSUI, type = ro, define = yes;
    PASSTAIL: load = APP, run = PASSTAIL, type = ro, define = yes;
    ASSETS: load = AUXASSET, type = ro, define = yes;
    TEXTASSETS: load = AUXTEXT, type = ro, define = yes;
    ASSETEXTRA: load = AUXEXTRA, type = ro, define = yes, optional = yes;
}
